# Builds the item-analysis nightly-job image and deploys it as a Cloud Run JOB.
# Separate from the serving backend — carries sentence-transformers/torch, which the exam
# backend never should. One-off / on-change:  gcloud builds submit --config cloudbuild-itemanalysis.yaml
# The nightly trigger is a Cloud Scheduler job (created once, see docs/MULTI_COURSE_MIGRATION §4.8).
steps:
  # Build (context = backend/, custom Dockerfile)
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args:
      - build
      - -f
      - Dockerfile.itemanalysis
      - -t
      - me-west1-docker.pkg.dev/ai-examiner-system/ai-examiner-system-repo/item-analysis:latest
      - .

  # Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - me-west1-docker.pkg.dev/ai-examiner-system/ai-examiner-system-repo/item-analysis:latest

  # Deploy the Cloud Run Job (create or update)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - jobs
      - deploy
      - item-analysis-nightly
      - --image=me-west1-docker.pkg.dev/ai-examiner-system/ai-examiner-system-repo/item-analysis:latest
      - --region=me-west1
      - --service-account=1023741330092-compute@developer.gserviceaccount.com
      - --set-env-vars=GCS_SUBMISSIONS_BUCKET=ai-exam-submission
      - --memory=2Gi
      - --cpu=2
      - --task-timeout=900
      - --max-retries=1

images:
  - me-west1-docker.pkg.dev/ai-examiner-system/ai-examiner-system-repo/item-analysis:latest

# The model download + torch install make this a slow build; give it room.
timeout: 1800s
options:
  machineType: 'E2_HIGHCPU_8'
